# Render Infrastructure Blueprint for RecoverAI
# Documentation: https://render.com/docs/blueprint-spec

databases:
  - name: recoverai-db
    databaseName: recoverai
    user: postgres
    plan: free
    region: oregon

services:
  # 1. FastAPI Backend Service
  - type: web
    name: recoverai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recoverai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

  # 2. Frontend React Dashboard (Vite Single-Page Application)
  - type: web
    name: recoverai-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: oregon
    plan: free
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: recoverai-backend
          property: host
